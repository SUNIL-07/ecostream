name: Weekly Model Retraining

on:
  schedule:
    - cron: '0 0 * * 0'  # Runs at 00:00 UTC every Sunday
  workflow_dispatch:      # Allows manual trigger

jobs:
  retrain-model:
    runs-on: ubuntu-latest
    
    # Needs permissions to push the newly tuned model back to the repository
    permissions:
      contents: write
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required for pushing changes
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Execute Retraining Pipeline
      env:
        SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      run: python scripts/ml_retrain.py
      
    - name: Commit & Push Updated Model Artifacts
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-tune: Updated LightGBM champion model and scalers [skip ci]"
        file_pattern: "artefacts/*.joblib"
        branch: main
